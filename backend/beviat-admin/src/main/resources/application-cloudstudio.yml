# CloudStudio 部署配置 - 使用 H2 内存数据库，禁用 Redis
spring:
  datasource:
    url: jdbc:h2:mem:beviat;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# 文件存储使用临时目录
file:
  storage:
    mode: local
    local:
      path: /tmp/beviat-files
      url-prefix: /api/v1/files/

logging:
  level:
    root: INFO
    com.beviat: DEBUG
