server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: beviat

  datasource:
    urlurl: jdbc: mysql: / / localhost: 3306 / beviat ? useUnicode = true& characterEncoding = utf8& useSSL = false& serverTimezone =亚洲/ Shanghai& allowPublicKeyRetrieval = true& rewriteBatchedStatements = true: jdbc:mysql://localhost:3306/beviat?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password:root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.beviat.**.domain,com.beviat.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration: 
    map-underscore-to-camel-case: truemap-underscore-to-camel-case:真
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT配置
jwt:
  secret: beviat-secret-key-for-jwt-token-generation-2024-must-be-long-enough
  access-token-expire: 900000   # 15分钟
  refresh-token-expire: 604800000  # 7天

# SpringDoc (Swagger) 配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# 文件存储配置（开发用本地存储）
file:
  storage:
    mode: local  # local / minio / oss
    local:
      path: 你的minio存储文件地址
      url-prefix: http://localhost:8080/api/v1/files/
  upload:
    max-size: 10485760  # 10MB
    allowed-types: jpg,jpeg,png,gif,bmp,webp,pdf,doc,docx,xls,xlsx

# 日志配置
logging:
  level:
    root: INFO
    com.beviat: DEBUG
    com.baomidou.mybatisplus: WARN
  file:
    name: logs/beviat.log
